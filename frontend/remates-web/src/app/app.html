<nav class="app-nav">
  <a class="brand" [routerLink]="isAuthenticated() ? '/dashboard' : '/login'">
    <app-logo [size]="30" />
    <span class="brand__text">
      <span class="brand__name"><span class="brand__auto">Auto</span><span class="brand__margin">Margin</span></span>
      <span class="brand__by">by andyjara<span class="brand__tld">.dev</span></span>
    </span>
  </a>

  <div class="app-nav__links">
    @if (isAuthenticated()) {
      <a routerLink="/dashboard" routerLinkActive="active">Estado</a>
      <a routerLink="/analizador" routerLinkActive="active">Analizador</a>
      <a routerLink="/remate" routerLinkActive="active">Remate</a>
      <a routerLink="/vehiculos" routerLinkActive="active">Vehículos</a>
      <a routerLink="/mercado" routerLinkActive="active">Mercado</a>
      <a routerLink="/parametros" routerLinkActive="active">Parámetros</a>
      <a routerLink="/manual" routerLinkActive="active">Manual</a>
    }
  </div>

  <div class="app-nav__session">
    @if (user(); as u) {
      <a routerLink="/cuenta" routerLinkActive="active" class="session__user" [title]="u.email">
        {{ u.fullName || u.email }}
      </a>
      <button type="button" class="session__out" (click)="logout()">Salir</button>
    } @else {
      <a routerLink="/login" class="session__in">Iniciar sesión</a>
    }
  </div>
</nav>

<router-outlet />
