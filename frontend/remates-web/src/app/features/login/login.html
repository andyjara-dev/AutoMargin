<div class="login">
  <form class="panel" [formGroup]="form" (ngSubmit)="submit()">
    <div class="panel__brand">
      <app-logo [size]="52" />
      <span class="panel__name"><span class="auto">Auto</span><span class="margin">Margin</span></span>
      <span class="panel__by">by andyjara<span class="tld">.dev</span></span>
    </div>

    <h1>Iniciar sesión</h1>
    <p class="panel__lead">Accede para gestionar vehículos, análisis e inventario.</p>

    @if (error()) {
      <div class="alert">{{ error() }}</div>
    }

    <label>
      Correo
      <input type="email" formControlName="email" autocomplete="username" placeholder="tu@correo.cl" />
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    <button type="submit" class="submit" [disabled]="loading()">
      {{ loading() ? 'Entrando…' : 'Entrar' }}
    </button>

    <p class="panel__foot">
      El analizador funciona sin iniciar sesión.
      <a routerLink="/analizador">Ir al analizador →</a>
    </p>
  </form>
</div>
