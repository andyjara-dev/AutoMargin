# Nginx del contenedor web: sirve la aplicación Angular y reenvía /api a la API.
#
# Al vivir ambos en el mismo origen desaparece el CORS, y el Nginx del servidor solo
# necesita apuntar a un único puerto.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión: el bundle de Angular baja de ~290 KB a ~80 KB.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad básicas. La API va en el mismo origen, así que connect-src 'self' basta.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- API ----------
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Conserva el esquema original para que la API sepa que el cliente llegó por HTTPS.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://api:8080/health;
        access_log off;
    }

    # ---------- Estáticos ----------

    # Los archivos con hash en el nombre no cambian nunca: se cachean indefinidamente.
    location ~* \.(js|css|woff2|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El index nunca se cachea: es lo que apunta a los bundles nuevos tras un despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Angular maneja el enrutado: cualquier ruta desconocida devuelve el index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
