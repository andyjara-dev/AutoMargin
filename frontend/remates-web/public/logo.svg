<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 120" role="img" aria-label="AutoMargin">
  <defs>
    <linearGradient id="am" x1="8%" y1="5%" x2="92%" y2="95%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="52%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#am)" stroke-linecap="round" stroke-linejoin="round">
    <!-- La A: chevron ancho con el vértice generosamente redondeado -->
    <path d="M 12 106 L 51 26 Q 58 12 65 26 L 88 73" stroke-width="12"/>

    <!-- El auto: trazo horizontal que cruza la pierna derecha y cierra en el lóbulo trasero -->
    <path d="M 28 92 C 45 68, 74 62, 95 74 C 112 84, 110 104, 92 104 C 76 104, 66 94, 46 92"
          stroke-width="10.5"/>
  </g>
</svg>
